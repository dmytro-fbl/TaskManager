name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskManager.sln

      - name: Build
        run: dotnet build TaskManager.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TaskManager.sln --no-build --configuration Release

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/task-frontend-manual

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/task-frontend-manual/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
